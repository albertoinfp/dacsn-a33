services:
  web:
    image: nginx:1.30
    restart: unless-stopped
    volumes:
      - codigo:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontal
    ports:
      - "${PUERTO:-8080}:80"
    depends_on:
      - yourls

  yourls:
    image: yourls:1.10.6-fpm
    restart: unless-stopped
    environment:
      YOURLS_DB_HOST: bd
      YOURLS_DB_NAME: ${BD_NOMBRE}
      YOURLS_DB_USER: ${BD_USUARIO}
      YOURLS_DB_PASS: ${BD_CONTRASENA}
      YOURLS_SITE: http://${DIRECCION}:${PUERTO:-8080}
      YOURLS_USER: ${YOURLS_USUARIO}
      YOURLS_PASS: ${YOURLS_CONTRASENA}
    volumes:
      - codigo:/var/www/html
    networks:
      - frontal
      - interna
    depends_on:
      bd:
        condition: service_healthy

  bd:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${BD_NOMBRE:-yourls}
      MARIADB_USER: ${BD_USUARIO:-yourls}
      MARIADB_PASSWORD: ${BD_CONTRASENA:?falta en el fichero .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - bd-datos:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  codigo:
  bd-datos:

networks:
  frontal:
  interna: