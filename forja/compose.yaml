services:
  tienda:
    image: forgejo:17
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: bd:5432
      FORGEJO__database__NAME: ${BD_NOMBRE}
      FORGEJO__database__USER: ${BD_USUARIO}
      FORGEJO__database__PASSWD: ${BD_CONTRASENA}
      
      FORGEJO__server__DOMAIN: ${DIRECCION}
      FORGEJO__server__ROOT_URL: http://${DIRECCION}:${PUERTO:-3000}/
      FORGEJO__server__SSH_PORT: ${PUERTO_SSH}
      FORGEJO__server__SSH_LISTEN_PORT: 22
      
      FORGEJO__security__INSTALL_LOCK: "true"
     
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp
      FORGEJO__mailer__SMTP_ADDR: correo
      FORGEJO__mailer__SMTP_PORT: 1025
      FORGEJO__mailer__FROM: forgejo@dascn.local
      
      FORGEJO__cache__ADAPTER: redis
      FORGEJO__cache__HOST: redis://:${REDIS_CONTRASENA}@cache:6379/0

      FORGEJO__session__PROVIDER: redis
      FORGEJO__session__PROVIDER_CONFIG: redis://:${REDIS_CONTRASENA}@cache:6379/0

      FORGEJO__queue__TYPE: redis
      FORGEJO__queue__CONN_STR: redis://:${REDIS_CONTRASENA}@cache:6379/0

      USER_UID: 1000
      USER_GID: 1000

    volumes:
      - forgejo-datos:/data
    networks:
      - interna
    ports:
      - "${PUERTO:-3000}:3000"
      - "${PUERTO_SSH:-2222}:22"
    depends_on:
     bd:
        condition: service_healthy
        cache:
          condition: service_healthy
        correo:
          condition: service_started
    restart: unless-stopped

  bd:
    image: postgres:18
    environment:
      POSTGRES_DB: ${NOMBRE_BD}
      POSTGRES_USER: ${USUARIO_BD}
      POSTGRES_PASSWORD: ${CONTRASENA_BD}
    volumes:
      - bd-datos:/var/lib/postgresql
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  correo:
    image: axllent/mailpit
    ports:
      - "${PUERTO_CORREO:-8025}:8025"
    networks:
      - interna
    restart: unless-stopped

  cache:
    image: redis:7.2
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_CONTRASENA:?falta en el fichero .env}
    volumes:
      - cache-datos:/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forgejo-datos:
  bd-datos:
  cache-datos:

networks:
  interna:
    