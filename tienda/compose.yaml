services:
  tienda:
    image: prestashop/prestashop:8.2
    environment:
      PS_INSTALL_AUTO= 1
      PS_LANGUAGE= es
      PS_COUNTRY= ES
      PS_DEV_MODE= 0
      PS_FOLDER_ADMIN= admin-tienda
      PS_FOLDER_INSTALL= install-tienda
      PS_DEMO_MODE= 0
      ADMIN_MAIL= "${CORREO_ADMIN}"
      ADMIN_PASSWD= "${CONTRASENA_ADMIN}"
      DB_SERVER= bd
      DB_NAME= "${NOMBRE_BD}"
      DB_USER= "${USUARIO_BD}"
      DB_PASSWD= "${CONTRASENA_BD}"
    volumes:
      - ficherosTienda=/var/www/html
    networks:
    ports:
      - "${PUERTO:-8080}:80"
    depends_on:
    restart:

  bd:
    image: prestashop/prestashop:8.2
    environment:
    volumes:
    networks:
    ports:
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--inoodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
    restart:

  correo:
    image: prestashop/prestashop:8.2
    environment:
    volumes:
    networks:
    ports:
    depends_on:
    restart:

volumes:
  ficherosTienda:


networks:
  interna: